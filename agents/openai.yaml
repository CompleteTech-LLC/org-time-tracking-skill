interface:
  display_name: "Org Time Tracking Skill"
  short_description: "Track and bill time spent with an organization from Outlook, Teams and calendar evidence"
  default_prompt: "Use $org-time-tracking: before the first collection relay the SKILL.md Before You Start table (this skill reads the operator's own signed-in Outlook mail, Teams chats and calendar through a browser session, writes a time-tracking workbook, a redacted evidence tree and an HTML report to a folder the operator chooses, transmits nothing, and treats meeting attendance, billing parameters and branding as operator decisions); ask me for the organization domain, period, time zone, my names, billing rules (minimum per lapse, increment, meeting-day minimum, held-meeting rule) and branding (neutral unless I choose the CompleteTech preset or give my own); then gather the evidence, compute billed time per day under those rules, build the workbook, calendar and report, recalculate and verify, and list borderline cases for my decision."

policy:
  allow_implicit_invocation: false
